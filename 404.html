<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Code</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16161e;color:#c0caf5;font:14px ui-monospace,Menlo,monospace}div{max-width:36rem;padding:2rem;text-align:center;line-height:1.6}code{color:#7aa2f7}</style></head>
<body><div id="m">Starting&hellip;</div>
<script>
// GitHub Pages serves this for any path it doesn't have, e.g. /app/ on a first visit.
// Install the service worker, then reload so it can answer the request.
(async function () {
  var m = document.getElementById('m');
  if (!('serviceWorker' in navigator)) { m.textContent = 'This site needs service workers.'; return; }
  var key = location.pathname.split('/')[1] || '';
  if (navigator.serviceWorker.controller) {
    m.innerHTML = 'No preview named <code>' + key.replace(/[<>&"]/g, '') + '</code>. Open the editor at <a href="/" style="color:#7aa2f7">/</a> and create it first.';
    return;
  }
  try {
    await navigator.serviceWorker.register('/wasmer-service-worker.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller) location.reload();
    else navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
  } catch (e) { m.textContent = 'Could not start the service worker: ' + e; }
})();
</script></body></html>
